# Deny everything, then allow only what the app needs. The app makes no outbound calls,
# so it gets no egress at all, not even DNS. A compromised pod has nowhere to send data.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-in
spec:
  podSelector:
    matchLabels:
      app: demo-app
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
