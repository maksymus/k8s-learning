kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-learning
# Lets containerd read per-registry config from /etc/containerd/certs.d,
# which 01-cluster.sh uses to point localhost:5001 at the local registry container.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
