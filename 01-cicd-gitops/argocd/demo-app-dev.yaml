# Tells Argo CD: "make namespace demo-dev look like overlays/dev in the manifests repo, forever."
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/demo-app-manifests.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true    # delete resources that were removed from Git
      selfHeal: true # revert manual kubectl changes (drift)
    syncOptions:
      - CreateNamespace=true
